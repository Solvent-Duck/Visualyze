[workspace]
members = ["public/types/rust", "public/tools/rust-bundle", "public/mcp-server", "private/layout", "private/runtime"]
default-members = ["private/runtime"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
jsonschema = { version = "=0.58.2", default-features = false }
bevy = { version = "=0.18.1", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
  "bevy_winit", "bevy_window", "keyboard", "mouse", "bevy_render",
  "bevy_core_pipeline", "bevy_post_process", "bevy_pbr", "bevy_ui", "bevy_ui_render",
  "default_font", "png",
] }

# Keep the first native build manageable while retaining responsive rendering.
[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2
