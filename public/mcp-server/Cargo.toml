[package]
name = "visualyze-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "MCP bridge between a coding agent and the local Visualyze viewer"

[dependencies]
serde.workspace = true
serde_json.workspace = true
visualyze-model = { path = "../types/rust" }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "=1.53.2", features = ["rt", "io-std", "io-util", "net", "time", "sync", "process", "macros"] }
